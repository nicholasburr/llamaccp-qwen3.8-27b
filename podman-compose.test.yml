# Test deployment for validating a NEW image tag WITHOUT touching the active
# llama-server (container `llama-server`, port 8000, podman-compose.yml).
#
# Identical container config to the production service in podman-compose.yml,
# except:
#   - service/container name: llama-server-rocm10 (was llama-server)
#   - host port 8001 -> container port 8000 (in-container port stays 8000 so
#     the image HEALTHCHECK keeps working)
#   - restart: no (disposable — `make down-test` removes it)
#
#   make deploy-test                          # start (image ref synced by `make sync`)
#   make bench                                # A/B throughput vs port 8000
#   make down-test                            # stop & remove
#
# Note: the test container shares the iGPU with the production container, so
# numbers are "contended window" values (see README §2 and §4).

secrets:
  huggingface-token:
    external: true

networks:
  llama-network:
    external: true

services:
  llama-server-rocm10:
    image: localhost/llama-server:b10902-rocm-10.0.0
    container_name: llama-server-rocm10
    # Custom code to enable ipc: host in podman-compose. See fedora-setup.sh.
    ipc: host
    restart: "no"
    ports:
      - "8001:8000"
    devices:
      - /dev/dri
      - /dev/kfd
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    networks:
      - llama-network
    secrets:
      - source: huggingface-token
        type: env
        target: HF_TOKEN
    volumes:
      - /home/nburr/.cache/huggingface/hub/:/root/.cache/huggingface/hub/:Z
      - /home/nburr/.config/llama.cpp/:/root/.config/llama.cpp/:Z
    environment:
      # Model
      LLAMA_ARG_HF_REPO: "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
      LLAMA_ARG_ALIAS: "Qwen3.8-27B-ThinkingCoder"
      # Server (in-container port stays 8000; published as host 8001)
      LLAMA_ARG_LOG_TIMESTAMPS: "on"
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8000"
      # Runtime
      LLAMA_ARG_THREADS: "8"
      LLAMA_ARG_LOAD_MODE: "auto"
      LLAMA_ARG_FIT: "off"
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_CTX_SIZE: "262144"
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_CONT_BATCHING: "on"
      LLAMA_ARG_SPEC_TYPE: "draft-mtp"
      LLAMA_ARG_CACHE_TYPE_K: "q8_0"
      LLAMA_ARG_CACHE_TYPE_V: "q8_0"
      # Features
      LLAMA_ARG_UI: "on"
      LLAMA_ARG_UI_MCP_PROXY: "on"
      LLAMA_ARG_AGENT: "on"
      LLAMA_ARG_TOOLS: "all"
      LLAMA_ARG_REASONING: "on"
      LLAMA_ARG_THINK: "auto"
      LLAMA_ARG_JINJA: "on"
      LLAMA_ARG_TOP_K: "20"