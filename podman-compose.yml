# Podman Compose deployment of llama-server (ROCm, Strix Halo).
#
# One of three EQUIVALENT deployment methods — all define the identical
# container (name, image, port 8000, devices, IPC, volumes, env); see
# README.md. Run exactly ONE of them at a time:
#   1. scripts/llama-server.sh         -> podman run
#   2. this file                       -> podman compose up -d
#   3. config/containers/systemd/...   -> quadlet (llama-server.service)
#
#   podman compose up -d              # start (recreates if changed, like --replace)
#   podman compose down               # stop & remove
#   podman compose logs -f llama-server

secrets:
  huggingface-token:
    external: true

networks:
  llama-network:
    external: true

services:
  llama-server:
    image: localhost/llama-server:b10896-rocm-7.2.4
    container_name: llama-server
    # Custom code to enable ipc: host in podman-compose. See fedora-setup.sh.
    ipc: host
    restart: unless-stopped
    ports:
      - "8000:8000"
    devices:
      - /dev/dri
      - /dev/kfd
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    networks:
      - llama-network
    secrets:
      - source: huggingface-token
        type: env
        target: HF_TOKEN
    volumes:
      - /home/nburr/.cache/huggingface/hub/:/root/.cache/huggingface/hub/:Z
      - /home/nburr/.config/llama.cpp/:/root/.config/llama.cpp/:Z
    environment:
      # Model
      LLAMA_ARG_HF_REPO: "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
      LLAMA_ARG_ALIAS: "Qwen3.8-27B-ThinkingCoder"
      # Server
      LLAMA_ARG_LOG_TIMESTAMPS: "on"
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8000"
      # Runtime
      LLAMA_ARG_THREADS: "8"
      LLAMA_ARG_LOAD_MODE: "auto"
      LLAMA_ARG_FIT: "off"
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_CTX_SIZE: "262144"
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_CONT_BATCHING: "on"
      LLAMA_ARG_SPEC_TYPE: "draft-mtp"
      LLAMA_ARG_CACHE_TYPE_K: "q8_0"
      LLAMA_ARG_CACHE_TYPE_V: "q8_0"
      # Features
      LLAMA_ARG_UI: "on"
      LLAMA_ARG_UI_MCP_PROXY: "on"
      LLAMA_ARG_AGENT: "on"
      LLAMA_ARG_TOOLS: "all"
      LLAMA_ARG_REASONING: "on"
      LLAMA_ARG_THINK: "auto"
      LLAMA_ARG_JINJA: "on"
      LLAMA_ARG_TOP_K: "20"
